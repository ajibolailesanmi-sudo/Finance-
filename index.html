<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack — Personal Finance Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">₣</span>
        <span class="brand-name">FinTrack</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">📊 Dashboard</button>
        <button class="nav-item" data-view="transactions">💸 Transactions</button>
        <button class="nav-item" data-view="budgets">🎯 Budgets</button>
        <button class="nav-item" data-view="recurring">🔁 Recurring &amp; Bills</button>
        <button class="nav-item" data-view="accounts">🏦 Accounts</button>
        <button class="nav-item" data-view="categories">🏷️ Categories</button>
        <button class="nav-item" data-view="settings">⚙️ Settings</button>
      </nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="ghost-btn" title="Toggle theme">🌙 Theme</button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="content">
      <header class="topbar">
        <h1 id="view-title">Dashboard</h1>
        <div class="topbar-actions">
          <select id="month-picker" class="month-picker" title="Reporting month"></select>
          <button id="quick-add" class="primary-btn">+ Add Transaction</button>
        </div>
      </header>
      <section id="view-root" class="view-root"></section>
    </main>
  </div>

  <!-- Modal host -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast host -->
  <div id="toast-host" class="toast-host"></div>

  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
