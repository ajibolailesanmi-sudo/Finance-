<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Apply — Senior Director, Regulatory Affairs CMC</title></head>
<body>
  <h1>Apply for this job</h1>
  <form id="application_form" method="post" action="/apply">
    <label>First Name <input type="text" name="first_name" id="first_name" required></label>
    <label>Last Name <input type="text" name="last_name" id="last_name" required></label>
    <label>Email <input type="email" name="email" id="email" required></label>
    <label>Phone <input type="tel" name="phone" id="phone"></label>
    <label>Resume/CV <input type="file" name="resume" id="resume" required></label>
    <label>Cover Letter <input type="file" name="cover_letter" id="cover_letter"></label>
    <label>Additional information
      <textarea name="additional_information" id="additional_information"></textarea>
    </label>
    <!-- The final submit control. The flow must NEVER activate this (I1). -->
    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</body>
</html>
