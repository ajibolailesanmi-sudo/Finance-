<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Apply — VP, Regulatory CMC</title></head>
<body>
  <h1>Submit your application</h1>
  <form id="application-form" method="post" action="/apply">
    <input type="text" name="name" id="name" placeholder="Full name" required>
    <input type="email" name="email" id="email" placeholder="Email" required>
    <input type="tel" name="phone" id="phone" placeholder="Phone">
    <input type="text" name="org" id="org" placeholder="Current company">
    <input type="file" name="resume" id="resume" required>
    <textarea name="comments" id="comments" placeholder="Additional information"></textarea>
    <button type="submit" id="btn-submit">Submit application</button>
  </form>
</body>
</html>
